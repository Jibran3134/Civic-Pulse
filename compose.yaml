services:
  postgres:
    image: postgres:16-alpine
    container_name: civicpulse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: civicpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: civicpulse-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    restart: unless-stopped

  ollama:
    # 0.1.47 predates llama3.2 and cannot read its tensor layout. Every call
    # died with "wrong number of tensors; expected 147, got 146", the runner
    # aborted, /api/generate returned 500, and the provider silently fell back
    # to rules -- so the container still reported healthy while inference was
    # completely broken. CI never caught it because ci.yml starts the stack
    # without ollama and pins TRIAGE_PROVIDER=simulated.
    #
    # 0.34.4 is the version verified working on this machine. Pinned rather
    # than `latest`, matching how every other image in this file is pinned.
    image: ollama/ollama:0.34.4
    container_name: civicpulse-ollama
    volumes:
      # Model weights, so `ollama pull` does not re-download ~1.3 GB on every
      # `compose up`. Useless without the network note below.
      - ollama_models:/root/.ollama
    networks:
      - internal
      # Ollama joins BOTH networks deliberately. It needs `internal` so the
      # backend can reach it, but `internal: true` means no route to the
      # internet -- so without a second, non-internal network the container can
      # never run `ollama pull` and this volume can never be populated. Joining
      # `edge` grants outbound access without exposing Ollama to the frontend:
      # its only ingress is from the backend, and it publishes no host port.
      - edge
    healthcheck:
      # This actually runs inference. The previous check was "ollama list",
      # which exits 0 with zero models AND with models that cannot be loaded,
      # so the container reported healthy through the entire 0.1.47 outage in
      # which every request returned HTTP 500 and the provider silently fell
      # back to rules. A named model makes that impossible: it exits 1 if the
      # model is missing or unloadable (verified: a bad name exits 1 in 1.8s).
      #
      # It doubles as a keep-alive. Ollama evicts a model after 5 idle minutes
      # (measured: 302s), and this interval is shorter than that, so the model
      # stays resident and the demo does not start with a ~5s cold load. Cold,
      # the check takes ~8.4s because it pays the model load itself; warm,
      # ~1s. interval must stay below 300s or the model evicts between checks.
      test: ["CMD", "ollama", "run", "llama3.2:1b", "ok"]
      interval: 30s
      timeout: 30s
      retries: 3
      # The first check includes the model load, so it needs more room than the
      # 30s interval would otherwise allow before failures start counting.
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    restart: unless-stopped

  # One-shot: applies Alembic migrations, then seeds, in that order, and exits.
  #
  # Without this a clean clone brings up Postgres with no `complaints` table, so
  # every API call fails with `relation "complaints" does not exist` -- while
  # /health passes and the container reports healthy, because the liveness probe
  # deliberately does not touch the database. `restart: "no"` is required, not
  # optional: with `unless-stopped` a failing migration would be retried in a
  # loop forever.
  #
  # A separate service rather than a backend entrypoint, so the backend image
  # stays a plain web server and the migration is not re-run on every restart.
  # backend depends on it completing, so no request can arrive before the
  # schema exists.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicpulse-migrate
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed.py"]
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/civicpulse
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicpulse-backend
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/civicpulse
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TRIAGE_PROVIDER=${TRIAGE_PROVIDER:-simulated}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:1b
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    networks:
      - edge
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Migrations and seed must finish before the first request arrives,
      # otherwise /ready passes against an empty schema.
      migrate:
        condition: service_completed_successfully
    volumes:
      # Bind mount for hot reload. Right in compose.yaml because a developer
      # editing app/ should not have to rebuild the image; wrong in
      # compose.prod.yaml because production must run the immutable artifact CI
      # built and scanned, and a bind mount would silently override it with
      # whatever happens to be on the host.
      - ./backend:/app
    healthcheck:
      # Hits /health, the liveness endpoint, which never touches Postgres or
      # Redis. A healthcheck that failed on a slow database would restart a
      # perfectly healthy container and cascade the failure through
      # depends_on: service_healthy.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicpulse-frontend
    networks:
      - edge
    depends_on:
      - backend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:
  ollama_models: