name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-type:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend deps
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Ruff lint
        run: |
          cd backend
          ruff check .

      - name: MyPy typecheck
        run: |
          cd backend
          mypy app/ --ignore-missing-imports --no-strict-optional \
            --disable-error-code=import-not-found \
            --disable-error-code=attr-defined \
            --disable-error-code=no-untyped-def \
            --disable-error-code=no-untyped-call

      - name: Set up Node
        if: ${{ steps.check.outputs.exists == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: |
          cd frontend
          npm ci

      - name: ESLint
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: |
          cd frontend
          npm run lint

      - name: TypeScript typecheck
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: |
          cd frontend
          npx tsc --noEmit

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civicpulse
      REDIS_URL: redis://localhost:6379/0
      TRIAGE_PROVIDER: simulated
      GROQ_API_KEY: ""
      LOG_LEVEL: INFO
      ENVIRONMENT: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civicpulse
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL & Redis client tools
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend deps
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres ready"
              break
            fi
            sleep 2
          done
          for i in {1..30}; do
            if redis-cli -h localhost -p 6379 ping; then
              echo "Redis ready"
              break
            fi
            sleep 2
          done

      - name: Drop and recreate test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "DROP DATABASE IF EXISTS civicpulse;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE civicpulse;"

      - name: Run migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Run tests with coverage
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-fail-under=65

      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check frontend exists
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: ${{ steps.check.outputs.exists == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Node
        if: ${{ steps.check.outputs.exists == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        if: ${{ steps.check.outputs.exists == 'true' }}
        run: |
          cd frontend
          npm ci

      - name: Run Vitest
        if: ${{ steps.check.outputs.exists == 'true' }}
        run: |
          cd frontend
          npm run test -- --run --coverage

  build:
    name: Build & Scan Images
    runs-on: ubuntu-latest
    needs: [lint-and-type, test-backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontend exists
        id: check-frontend
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          load: true

      - name: Trivy scan (backend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          scan-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Build frontend
        id: build-frontend
        if: ${{ steps.check-frontend.outputs.exists == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          load: true

      - name: Trivy scan (frontend)
        if: ${{ steps.check-frontend.outputs.exists == 'true' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          scan-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

  manifests:
    name: Kubeconform Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check k8s exists
        id: check
        run: |
          if [ -f k8s/overlays/prod/kustomization.yaml ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: ${{ steps.check.outputs.exists == 'true' }}
        uses: actions/checkout@v4

      - name: Install kustomize
        if: ${{ steps.check.outputs.exists == 'true' }}
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Validate manifests
        if: ${{ steps.check.outputs.exists == 'true' }}
        run: |
          kustomize build k8s/overlays/prod | kubeconform -strict -summary

  integration:
    name: Compose Integration Smoke
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ""
      TRIAGE_PROVIDER: simulated
      POSTGRES_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=postgres
          TRIAGE_PROVIDER=simulated
          GROQ_API_KEY=
          LOG_LEVEL=INFO
          ENVIRONMENT=development
          EOF

      - name: Start compose stack (no ollama)
        run: |
          docker compose up -d --build postgres redis backend

      - name: Run migrations
        run: |
          for i in {1..20}; do
            if docker compose exec -T backend alembic upgrade head 2>&1; then
              echo "Migrations applied"
              break
            fi
            echo "Waiting for backend to start... ($i)"
            sleep 3
          done

      - name: Wait for /ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/ready | grep -q '"status":"ready"'; then
              echo "Backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout waiting for /ready"
          docker compose logs backend
          exit 1

      - name: Submit complaint
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/api/complaints \
            -H "Content-Type: application/json" \
            -d '{"text":"Water main burst on Mall Road since fajr water entering ground floors","location":"Mall Road, Lahore"}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"open"'

      - name: Verify complaint persisted
        run: |
          curl -sf http://localhost:8000/api/complaints | grep -q "Mall Road"

      - name: Verify cache behavior
        run: |
          # First call - MISS
          curl -sf http://localhost:8000/api/stats | grep -q "by_category"
          # Second call - HIT
          curl -sf http://localhost:8000/api/stats | grep -q "by_category"

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
