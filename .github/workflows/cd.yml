name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CLUSTER_NAME: civicpulse-ci

jobs:
  test:
    name: Full Test Suite
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      packages: write
      contents: read
    outputs:
      backend-digest: ${{ steps.push-backend.outputs.digest }}
      frontend-digest: ${{ steps.push-frontend.outputs.digest }}
      image-tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalise image name to lowercase
        run: echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set image tag (SHA)
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push backend
        id: push-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.set-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        id: push-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.set-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Generate SBOM (backend)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.set-tag.outputs.tag }}
          output-file: sbom-backend.spdx.json

      - name: Generate SBOM (frontend)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.set-tag.outputs.tag }}
          output-file: sbom-frontend.spdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            sbom-backend.spdx.json
            sbom-frontend.spdx.json

  deploy-k8s:
    name: Deploy to K8s (k3d)
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create k3d cluster
        run: |
          k3d cluster create ${{ env.CLUSTER_NAME }} \
            --servers 1 --agents 2 \
            --port "80:80@loadbalancer" \
            --port "443:443@loadbalancer" \
            --wait

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Apply K8s manifests (SHA tag)
        run: |
          cd k8s/overlays/prod
          kustomize edit set image \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ needs.build-push.outputs.image-tag }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ needs.build-push.outputs.image-tag }}
          kustomize build . | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/civicpulse-backend -n civicpulse --timeout=300s
          kubectl rollout status deployment/civicpulse-frontend -n civicpulse --timeout=300s

      - name: Smoke test Ingress
        run: |
          sleep 10
          INGRESS_IP=$(kubectl get svc -n civicpulse civicpulse-frontend -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          if [ -z "$INGRESS_IP" ]; then
            INGRESS_IP="localhost"
          fi
          curl -sf "http://$INGRESS_IP/health" || curl -sf "http://$INGRESS_IP/api/health"

      - name: Print HPA status
        run: |
          kubectl get hpa -n civicpulse

      - name: Cleanup cluster
        if: always()
        run: |
          k3d cluster delete ${{ env.CLUSTER_NAME }}