apiVersion: v1
kind: ConfigMap
metadata:
  name: civicpulse-config
  namespace: civicpulse
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  TRIAGE_PROVIDER: "llm:groq"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_MODEL: "llama3.2:1b"
  STATS_CACHE_TTL: "30"
  RATE_LIMIT_REQUESTS: "10"
  RATE_LIMIT_WINDOW: "60"
  RATE_LIMIT_BURST: "5"