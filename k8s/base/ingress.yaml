apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicpulse-ingress
  namespace: civicpulse
  annotations:
    # The backend mounts its own routes under /api (app/main.py includes the
    # complaints/stats/meta routers with prefix="/api"), so the Ingress must
    # pass the URI through untouched. A `rewrite-target: /$2` with a
    # `path: /api(/|$)(.*)` regex would strip the /api prefix and send
    # /api/stats to the backend as /stats, which 404s on every request.
    # nginx matches the longest prefix first, so the explicit /api rule wins
    # over the catch-all / below it without any regex at all.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: civicpulse.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
