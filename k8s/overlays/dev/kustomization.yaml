apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: civicpulse

resources:
  - ../../base

labels:
  - pairs:
      environment: dev
    includeSelectors: false

images:
  - name: ghcr.io/CHANGE_ME/civicpulse-backend
    newTag: dev
  - name: ghcr.io/CHANGE_ME/civicpulse-frontend
    newTag: dev

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
        namespace: civicpulse
      spec:
        replicas: 1
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
        namespace: civicpulse
      spec:
        replicas: 1
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: civicpulse-config
        namespace: civicpulse
      data:
        ENVIRONMENT: "development"
        LOG_LEVEL: "DEBUG"
        TRIAGE_PROVIDER: "simulated"