# Alembic Configuration
# https://alembic.sqlalchemy.org/en/latest/config.html

[alembic]
# Template used for migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Max length of characters to apply to the slug
truncate_slug_length = 40

# Version path
version_locations = alembic/versions

# Migration script location
script_location = alembic

# SQLAlchemy URL (will be overridden by env.py)
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/civicpulse

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S