[project]
name = "civicpulse-backend"
version = "0.1.0"
description = "CivicPulse Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework — unpinned so pip can pick a release with starlette>=1.3.1
    "fastapi>=0.115.6",
    "starlette>=1.3.1",                # CVE-2024-47874, CVE-2026-48818, CVE-2026-54283
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.5",
    # Database
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "psycopg-pool>=3.3.3",
    # Cache / queue
    "redis>=5.0.1",
    "msgpack>=1.2.1",                  # GHSA-6v7p-g79w-8964 (transitive via redis)
    # HTTP / forms
    "httpx>=0.27.2",
    "python-multipart>=0.0.30",        # CVE-2024-53981, CVE-2026-24486, CVE-2026-42561, CVE-2026-53539
    # Utilities
    "python-json-logger==2.0.7",
    "alembic>=1.13.1",
    "email-validator==2.2.0",
    "greenlet>=3.0",
    "prometheus-client>=0.19",
    # Explicit constraints for Trivy CVE fixes
    "setuptools>=78.1.1",              # CVE-2025-47273 (CVE fix: 70.3.0 -> 78.1.1)
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "httpx>=0.27.2",
]

[build-system]
requires = ["setuptools>=78.1.1", "wheel"]   # CVE-2025-47273
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "alembic"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "SIM", "T20", "ARG", "PL"]
ignore = [
    "S101", "S603", "S607",
    "B008", "PLR0913", "PLR0917", "PLR2004", "ARG001", "ARG002",
    "PLW0603", "PLC0415", "UP042", "F841", "F401", "E402",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
no_implicit_optional = false
show_error_codes = true
exclude = ["alembic/", "tests/"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: needs a live Postgres and Redis (CI supplies them as service containers)",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError"]